server:
  port: 9061

spring:
  profiles:
    active: deploy
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

springdoc:
  swagger-ui:
    path: /doc
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    default-models-expand-depth: -1

service:
  name: Data-Editing-Tool
  cors:
    methods:
      GET,
      POST,
      PUT,
      PATCH,
      DELETE,
      OPTIONS,
      TRACE
  doc:
    title: Data-Editing-Tool API 문서
    desc: Data-Editing-Tool API 문서입니다.
    security:
      status: true
